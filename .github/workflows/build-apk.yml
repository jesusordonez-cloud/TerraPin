name: Compilar APK de TerraPin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android (si no existe)
        run: test -d android || npx cap add android

      - name: Permisos de ubicación en AndroidManifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q ACCESS_FINE_LOCATION $M || sed -i 's#</manifest>#  <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n  <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n  <uses-feature android:name="android.hardware.location.gps"/>\n</manifest>#' $M

      - name: Sincronizar web → Android
        run: npx cap sync android

      - name: Compilar APK (debug)
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: TerraPin-4.0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
