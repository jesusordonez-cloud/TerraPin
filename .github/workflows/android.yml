name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools ndk;27.0.12077973"

      - name: Build PMTiles extractor for Android
        run: |
          set -euxo pipefail
          rm -rf /tmp/go-pmtiles
          git clone --depth 1 https://github.com/protomaps/go-pmtiles.git /tmp/go-pmtiles

          mkdir -p app/src/main/jniLibs/arm64-v8a

          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          export CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"

          cd /tmp/go-pmtiles

          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$CC" \
            go build -tags=netcgo -buildmode=pie -trimpath -ldflags="-s -w" \
            -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libpmtiles.so" .

          chmod +x "$GITHUB_WORKSPACE"/app/src/main/jniLibs/*/libpmtiles.so
          file "$GITHUB_WORKSPACE"/app/src/main/jniLibs/*/libpmtiles.so
          ls -lh "$GITHUB_WORKSPACE"/app/src/main/jniLibs/*/libpmtiles.so

      - name: Generate TerraPin launcher icons
        run: |
          set -euxo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path("app/src/main/res/drawable/terrapin_logo.png")
          img = Image.open(src).convert("RGBA")
          res = Path("app/src/main/res")

          # Foreground adaptativo: logo dentro de la zona segura.
          fg = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
          inner = 286
          scale = min(inner / img.width, inner / img.height)
          scaled = img.resize(
              (max(1, int(img.width * scale)), max(1, int(img.height * scale))),
              Image.Resampling.LANCZOS
          )
          fg.paste(
              scaled,
              ((432 - scaled.width) // 2, (432 - scaled.height) // 2),
              scaled
          )
          fg.save(res / "drawable" / "terrapin_launcher_foreground.png", optimize=True)

          # Iconos raster de compatibilidad para launchers OEM.
          for folder, size in [
              ("mipmap-mdpi", 48),
              ("mipmap-hdpi", 72),
              ("mipmap-xhdpi", 96),
              ("mipmap-xxhdpi", 144),
              ("mipmap-xxxhdpi", 192),
          ]:
              target_dir = res / folder
              target_dir.mkdir(parents=True, exist_ok=True)
              icon = Image.new("RGBA", (size, size), (255, 255, 255, 255))
              inner = int(size * 0.72)
              scale = min(inner / img.width, inner / img.height)
              scaled = img.resize(
                  (max(1, int(img.width * scale)), max(1, int(img.height * scale))),
                  Image.Resampling.LANCZOS
              )
              icon.paste(
                  scaled,
                  ((size - scaled.width) // 2, (size - scaled.height) // 2),
                  scaled
              )
              icon.save(target_dir / "ic_launcher.png", optimize=True)
              icon.save(target_dir / "ic_launcher_round.png", optimize=True)

          print("TerraPin launcher icons generated")
          PY

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TerraPin-v0.5.5-Stable-Logo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
