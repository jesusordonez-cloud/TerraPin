name: Import TerraPin 4.0 from ZIP

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  import-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild exact TerraPin 4.0 project
        shell: bash
        run: |
          set -euo pipefail
          cat .transfer/p* | base64 -d > /tmp/terrapin4.tar.xz
          echo "3db2b412d9efb931336d610d717260deedff963737939e51568f672d363c765b  /tmp/terrapin4.tar.xz" | sha256sum -c -
          rm -rf /tmp/terrapin-new
          mkdir -p /tmp/terrapin-new
          tar -xJf /tmp/terrapin4.tar.xz -C /tmp/terrapin-new
          test -f /tmp/terrapin-new/TerraPin-4.0/package.json
          grep -q '"version": "4.0.0"' /tmp/terrapin-new/TerraPin-4.0/package.json

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          shopt -s dotglob nullglob
          mv /tmp/terrapin-new/TerraPin-4.0/* .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace TerraPin with 4.0 project from ZIP"
          git push origin HEAD:main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build TerraPin 4.0 APK
        shell: bash
        run: |
          set -euo pipefail
          npm install
          test -d android || npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          grep -q ACCESS_FINE_LOCATION "$M" || sed -i 's#</manifest>#  <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n  <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n  <uses-feature android:name="android.hardware.location.gps"/>\n</manifest>#' "$M"
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TerraPin-4.0-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
