name: Compilar TerraPin 3.1 Capacitor

on:
  push:
    branches: [ terrapin-2.0-capacitor ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruir fuente TerraPin 2.0 base
        run: |
          set -euxo pipefail
          cat source/TerraPin-2.0.zip.b64.part* | base64 --decode > TerraPin-2.0.zip
          echo "bb08e350e82860fd4df38bc76e07442e952b20e1261680b7790a8d47942d52da  TerraPin-2.0.zip" | sha256sum -c -
          unzip -q TerraPin-2.0.zip
          test -f terrapin/package.json
          test -f terrapin/app.js
          test -f terrapin/index.html

      - name: Reconstruir parche TerraPin 2.1
        run: |
          set -euxo pipefail
          cat overrides/apply-v2.1.py.gz.part* > /tmp/apply-v2.1.py.gz
          echo "41efc7f3f3e2a704d8b57e943069257216e47f5950500158073e70363d582e3f  /tmp/apply-v2.1.py.gz" | sha256sum -c -
          gunzip -c /tmp/apply-v2.1.py.gz > /tmp/apply-v2.1.py
          echo "be816b54d59e88296b9b9368f54a4c43a6b6f393427af221d8570b826f2dd8fe  /tmp/apply-v2.1.py" | sha256sum -c -

      - name: Recuperar logo TerraPin anterior y aplicar mejoras 2.1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euxo pipefail
          python -m pip install --quiet pillow
          curl --fail --location             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github.raw+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPOSITORY/contents/app/src/main/res/drawable/terrapin_logo.webp?ref=main"             -o /tmp/terrapin_logo.webp
          test -s /tmp/terrapin_logo.webp
          python /tmp/apply-v2.1.py terrapin /tmp/terrapin_logo.webp
          grep -q '"version": "2.1.0"' terrapin/package.json
          grep -q 'POINT_ICONS' terrapin/app.js
          grep -q 'createReportPdf' terrapin/app.js

      - name: Aplicar mejoras GIS y diseño TerraPin 2.2
        run: |
          set -euxo pipefail
          python -m py_compile overrides/apply-v2.2.py
          python overrides/apply-v2.2.py terrapin
          grep -q '"version": "2.2.0"' terrapin/package.json
          grep -q 'exportProjectShape' terrapin/app.js
          grep -q 'importShapeFiles' terrapin/app.js
          grep -q 'shp.min.js' terrapin/index.html
          grep -q 'shpwrite.js' terrapin/index.html
          grep -q 'jszip.min.js' terrapin/index.html

      - name: Aplicar navegación, vista previa y rediseño TerraPin 2.3
        run: |
          set -euxo pipefail
          cat overrides/apply-v2.3.py.part* > /tmp/apply-v2.3.py
          echo "7fad236f14f1017e1f749535a706bbb34c58e23ffb28dd988929df9618e82a89  /tmp/apply-v2.3.py" | sha256sum -c -
          python -m py_compile /tmp/apply-v2.3.py
          python /tmp/apply-v2.3.py terrapin
          grep -q '"version": "2.3.0"' terrapin/package.json
          grep -q 'routeToWaypoint' terrapin/app.js
          grep -q 'previewReportPdf' terrapin/app.js
          grep -q 'route-card' terrapin/index.html

      - name: Aplicar selección de puntos, rediseño y actualización TerraPin 2.4
        run: |
          set -euxo pipefail
          cat overrides/apply-v2.4.py.gz.part* > /tmp/apply-v2.4.py.gz
          echo "b5e71053fee5d1b1b3ee800e81a3a1f194a3303d9a446d203aae433988dbd750  /tmp/apply-v2.4.py.gz" | sha256sum -c -
          gunzip -c /tmp/apply-v2.4.py.gz > /tmp/apply-v2.4.py
          echo "059d9b9cb539a996ea6a2bf94d64d4429b4af762f580256911fbb693cadd5468  /tmp/apply-v2.4.py" | sha256sum -c -
          python -m py_compile /tmp/apply-v2.4.py
          python /tmp/apply-v2.4.py terrapin
          grep -q '"version": "2.4.0"' terrapin/package.json
          grep -q 'selectedPointCard' terrapin/app.js
          grep -q 'Navegar desde mi ubicación' terrapin/index.html
          grep -q 'data-tab="points"' terrapin/index.html
          grep -q 'terrapin-shell-v2.4' terrapin/sw.js

      - name: Aplicar navegación off-road, mapa PDF y rediseño TerraPin 2.5
        run: |
          set -euxo pipefail
          cp overrides/apply-v2.5.py.gz /tmp/apply-v2.5.py.gz
          echo "cc882f0b6d0b72462ae0dfb1791b340358f1699174a51a6ca9b7dfe9d7180469  /tmp/apply-v2.5.py.gz" | sha256sum -c -
          gunzip -c /tmp/apply-v2.5.py.gz > /tmp/apply-v2.5.py
          echo "5ce7af50a74cec0d8fd7d13a6120ad626241b5e1ea8674f83508f1a9b69beaf1  /tmp/apply-v2.5.py" | sha256sum -c -
          python -m py_compile /tmp/apply-v2.5.py
          python /tmp/apply-v2.5.py terrapin
          grep -q '"version": "2.5.0"' terrapin/package.json
          grep -q 'tramo directo final' terrapin/app.js
          grep -q 'CARTOGRAFÍA DE CAMPO' terrapin/app.js
          grep -q 'FIELD GIS 2.5' terrapin/index.html
          grep -q 'terrapin-shell-v2.5' terrapin/sw.js

      - name: Aplicar editor PDF y Crystal UI TerraPin 2.6
        run: |
          set -euxo pipefail
          cp overrides/apply-v2.6.py.gz /tmp/apply-v2.6.py.gz
          echo "ab3efde5a59ab6ec749f15e8b8a5e9f2b6351c616e828109fc9a47e32b6d247d  /tmp/apply-v2.6.py.gz" | sha256sum -c -
          gunzip -c /tmp/apply-v2.6.py.gz > /tmp/apply-v2.6.py
          echo "6973b8986073e328bfc6944b35385e06638cabc444f6570bc5f7f7533ecf8808  /tmp/apply-v2.6.py" | sha256sum -c -
          python -m py_compile /tmp/apply-v2.6.py
          python /tmp/apply-v2.6.py terrapin
          grep -q '"version": "2.6.0"' terrapin/package.json
          grep -q 'pdf-editable' terrapin/index.html
          grep -q 'Elaborado por' terrapin/app.js
          grep -q 'reportLegendLabels' terrapin/app.js
          grep -q 'FIELD GIS 2.6' terrapin/index.html
          grep -q 'terrapin-shell-v2.6' terrapin/sw.js

      - name: Aplicar Premium Crystal y editor visible TerraPin 2.7
        run: |
          set -euxo pipefail
          cp overrides/apply-v2.7.py.gz /tmp/apply-v2.7.py.gz
          echo "5be3d77d8662264ed0df332f27aede25937eab97f3c0ee939fd1996233e78aad  /tmp/apply-v2.7.py.gz" | sha256sum -c -
          gunzip -c /tmp/apply-v2.7.py.gz > /tmp/apply-v2.7.py
          echo "2cf28680b33befb01c43d1e9d226e31056979bcab1162e1ea22e4cc0401c7406  /tmp/apply-v2.7.py" | sha256sum -c -
          python -m py_compile /tmp/apply-v2.7.py
          python /tmp/apply-v2.7.py terrapin
          grep -q '"version": "2.7.0"' terrapin/package.json
          grep -q 'PREMIUM CRYSTAL' terrapin/index.html
          grep -q 'RUTA SELECCIONADA' terrapin/app.js
          grep -q 'composition-stage' terrapin/index.html
          grep -q 'fitCompositionPreview' terrapin/app.js
          grep -q 'terrapin-shell-v2.7' terrapin/sw.js

      - name: Aplicar layout Premium Crystal y PDF aprobado TerraPin 2.8
        run: |
          set -euxo pipefail
          cp overrides/apply-v2.8.py.gz /tmp/apply-v2.8.py.gz
          echo "8e6eaf85f87d5da4b4a903aaca775da84cac5e3523f814357aa2af74a1d15770  /tmp/apply-v2.8.py.gz" | sha256sum -c -
          gunzip -c /tmp/apply-v2.8.py.gz > /tmp/apply-v2.8.py
          echo "028498e68bd3aa94fe499e79e1b25c9cb45dd971ee3e962dfd6fbd01226e2227  /tmp/apply-v2.8.py" | sha256sum -c -
          python -m py_compile /tmp/apply-v2.8.py
          python /tmp/apply-v2.8.py terrapin
          grep -q '"version": "2.8.0"' terrapin/package.json
          grep -q 'FIELD GIS 2.8' terrapin/index.html
          grep -q 'hud-cell' terrapin/app.js
          grep -q 'btnLayersQuick' terrapin/index.html
          grep -q 'drawPdfLegendCompact' terrapin/app.js
          grep -q 'terrapin-shell-v2.8' terrapin/sw.js

      - name: Aplicar corrección dinámica y cartografía real TerraPin 2.9
        run: |
          set -euxo pipefail
          cat overrides/apply-v2.9.py.gz.part* > /tmp/apply-v2.9.py.gz
          echo "9b3815b3b82d8a68b8acebe9d4c89c6bfc7d32802f3653f58c65ffad57f197ef  /tmp/apply-v2.9.py.gz" | sha256sum -c -
          gunzip -c /tmp/apply-v2.9.py.gz > /tmp/apply-v2.9.py
          echo "8b441cb0059da775f7008e3a040ff9ae4c01ba46de9314bcb7bde30433b6afa5  /tmp/apply-v2.9.py" | sha256sum -c -
          python -m py_compile /tmp/apply-v2.9.py
          python /tmp/apply-v2.9.py terrapin
          grep -q '"version": "2.9.0"' terrapin/package.json
          grep -q 'layoutFloatingChrome' terrapin/app.js
          grep -q 'buildReportBasemap' terrapin/app.js
          grep -q 'FIELD GIS <b>2.9</b>' terrapin/index.html
          grep -q 'terrapin-shell-v2.9' terrapin/sw.js

      - name: Aplicar TerraPin 3.0 Premium Crystal SIG
        run: |
          set -euxo pipefail
          cat overrides/apply-v3.0.patch.gz.part00 overrides/apply-v3.0.patch.gz.part01 overrides/apply-v3.0.patch.gz.part02x0 overrides/apply-v3.0.patch.gz.part02x1 overrides/apply-v3.0.patch.gz.part03 > /tmp/terrapin-v3.0.patch.gz
          echo "8389a71bd3e4515b1e82170d75ef63b0e1066d115c6cd670270ca19376de83db  /tmp/terrapin-v3.0.patch.gz" | sha256sum -c -
          gunzip -c /tmp/terrapin-v3.0.patch.gz > /tmp/terrapin-v3.0.patch
          echo "30960fbc54426c347f6022989f397b6f43ce645e968c100d854780e654a3971e  /tmp/terrapin-v3.0.patch" | sha256sum -c -
          patch -p1 -d terrapin < /tmp/terrapin-v3.0.patch
          grep -q '"version": "3.0.0"' terrapin/package.json
          grep -q 'bottom-stack' terrapin/index.html
          grep -q 'basemap-quick' terrapin/index.html
          grep -q 'folderTreeHtml' terrapin/app.js
          grep -q 'bindLayerDrag' terrapin/app.js
          grep -q 'map-widget legend-widget' terrapin/app.js
          grep -q 'reportLayout' terrapin/app.js
          grep -q 'reportMapStyle' terrapin/app.js
          grep -q 'FIELD GIS <b>3.0</b>' terrapin/index.html
          grep -q 'terrapin-shell-v3.0' terrapin/sw.js

      - name: Aplicar TerraPin 3.1 layout aprobado
        run: |
          set -euxo pipefail
          cat overrides/apply-v3.1.patch.gz.p00 overrides/apply-v3.1.patch.gz.p01 > /tmp/terrapin-v3.1.patch.gz
          echo "e8c9d7ab006f49a3fc6bd6e9e1b5c6992e41721cdbb8fc2bb56659240d41e4c4  /tmp/terrapin-v3.1.patch.gz" | sha256sum -c -
          gunzip -c /tmp/terrapin-v3.1.patch.gz > /tmp/terrapin-v3.1.patch
          echo "62debc5f2aebb85036b71a19868ee990df6d6011fef7defd47b412403d6d40e3  /tmp/terrapin-v3.1.patch" | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          src = Path('/tmp/terrapin-v3.1.patch').read_text()
          parts = src.split('diff -ruN ')
          out = [parts[0]]
          for part in parts[1:]:
              header = part.split('\n', 1)[0]
              if '/package-lock.json ' in header:
                  continue
              out.append('diff -ruN ' + part)
          Path('/tmp/terrapin-v3.1.apply.patch').write_text(''.join(out))
          PY
          patch --batch -p6 -d terrapin < /tmp/terrapin-v3.1.apply.patch
          grep -q '"version": "3.1.0"' terrapin/package.json
          grep -q 'FIELD GIS <b>3.1</b>' terrapin/index.html
          grep -q 'composition-drawer-toggle' terrapin/index.html
          grep -q 'A4 HORIZONTAL · PDF · 3.1' terrapin/app.js
          grep -q 'spMore' terrapin/app.js
          grep -q 'infoMore' terrapin/app.js
          grep -q 'terrapin-shell-v3.1' terrapin/sw.js
          ! grep -q 'id="basemapQuick"' terrapin/index.html

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verificar Android SDK preinstalado
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Validar TerraPin 3.1 e instalar dependencias GIS
        working-directory: terrapin
        run: |
          set -euxo pipefail
          node --check app.js
          node --check sw.js
          node -e "JSON.parse(require('fs').readFileSync('package.json')); JSON.parse(require('fs').readFileSync('capacitor.config.json')); JSON.parse(require('fs').readFileSync('manifest.json'));"
          npm install
          npm run prepare-www
          test -f www/jspdf.umd.min.js
          test -f www/shp.min.js
          test -f www/shpwrite.js
          test -f www/jszip.min.js
          test -f www/icon-512.png
          grep -q 'routeToWaypoint' www/app.js
          grep -q 'previewReportPdf' www/app.js
          grep -q 'route-card' www/index.html
          grep -q 'selectedPointCard' www/app.js
          grep -q 'Navegar desde mi ubicación' www/index.html
          grep -q 'data-tab="points"' www/index.html
          grep -q 'tramo directo final' www/app.js
          grep -q 'CARTOGRAFÍA DE CAMPO' www/app.js
          grep -q 'pdf-editable' www/index.html
          grep -q 'Elaborado por' www/app.js
          grep -q 'reportLegendLabels' www/app.js
          grep -q 'PREMIUM CRYSTAL' www/index.html
          grep -q 'RUTA SELECCIONADA' www/app.js
          grep -q 'composition-stage' www/index.html
          grep -q 'fitCompositionPreview' www/app.js
          grep -q 'hud-cell' www/app.js
          grep -q 'btnLayersQuick' www/index.html
          grep -q 'drawPdfLegendCompact' www/app.js
          grep -q 'layoutFloatingChrome' www/app.js
          grep -q 'buildReportBasemap' www/app.js
          grep -q 'bottom-stack' www/index.html
          grep -q 'folderTreeHtml' www/app.js
          grep -q 'bindLayerDrag' www/app.js
          grep -q 'map-widget legend-widget' www/app.js
          grep -q 'reportLayout' www/app.js
          grep -q 'reportMapStyle' www/app.js
          grep -q 'FIELD GIS <b>3.1</b>' www/index.html
          grep -q 'terrapin-shell-v3.1' www/sw.js
          grep -q 'composition-drawer-toggle' www/index.html
          grep -q 'spMore' www/app.js
          grep -q 'infoMore' www/app.js
          ! grep -q 'id="basemapQuick"' www/index.html

      - name: Crear proyecto Android
        working-directory: terrapin
        run: |
          set -euxo pipefail
          npx cap add android
          npx cap sync android

      - name: Permisos Android
        working-directory: terrapin
        run: |
          set -euxo pipefail
          M=android/app/src/main/AndroidManifest.xml
          for P in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION WAKE_LOCK; do
            grep -q "$P" "$M" || sed -i "s#<uses-permission android:name=\"android.permission.INTERNET\" />#<uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.$P\" />#" "$M"
          done
          grep -q ACCESS_FINE_LOCATION "$M"
          grep -q ACCESS_COARSE_LOCATION "$M"
          grep -q WAKE_LOCK "$M"

      - name: Aplicar logo TerraPin a iconos Android
        working-directory: terrapin
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          src = Image.open("icon-512.png").convert("RGBA")
          res = Path("android/app/src/main/res")
          for folder, size in [
              ("mipmap-mdpi", 48),
              ("mipmap-hdpi", 72),
              ("mipmap-xhdpi", 96),
              ("mipmap-xxhdpi", 144),
              ("mipmap-xxxhdpi", 192),
          ]:
              d = res / folder
              d.mkdir(parents=True, exist_ok=True)
              icon = src.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(d / "ic_launcher.png")
              icon.save(d / "ic_launcher_round.png")
          adaptive = res / "mipmap-anydpi-v26"
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              p = adaptive / name
              if p.exists():
                  p.unlink()
          print("Logo TerraPin anterior aplicado al launcher")
          PY

      - name: Compilar APK debug
        working-directory: terrapin/android
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar fuente TerraPin 3.1
        run: |
          set -euxo pipefail
          rm -f TerraPin-3.1-source.zip
          zip -qr TerraPin-3.1-source.zip terrapin             -x 'terrapin/node_modules/*'                'terrapin/www/*'                'terrapin/android/*'
          test -s TerraPin-3.1-source.zip
          sha256sum TerraPin-3.1-source.zip

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: TerraPin-3.1-apk
          path: terrapin/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar fuente 3.1
        uses: actions/upload-artifact@v4
        with:
          name: TerraPin-3.1-source
          path: TerraPin-3.1-source.zip
          if-no-files-found: error
